<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;height:100%;background:#1a1a1a;overflow:hidden}canvas{display:block}#l{position:fixed;top:4px;left:6px;color:#fff;font:12px monospace;z-index:2}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js","three/webgpu":"https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.webgpu.js","three/tsl":"https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.tsl.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"}}</script></head>
<body><div id="l"></div><script type="module">
const q = new URLSearchParams(location.search); const mode = q.get('r') ?? 'webgpu';
document.getElementById('l').textContent = 'r186 ' + mode + ' ' + location.search;
const { GLTFLoader } = await import('three/addons/loaders/GLTFLoader.js');
const { DRACOLoader } = await import('three/addons/loaders/DRACOLoader.js');
const { run } = await import('./__cmp-scene.js');
const dracoPath = 'https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/libs/draco/';
if (mode === 'webgl') {
  const THREE = await import('three');
  const { EffectComposer } = await import('three/addons/postprocessing/EffectComposer.js');
  const { RenderPass } = await import('three/addons/postprocessing/RenderPass.js');
  const { OutputPass } = await import('three/addons/postprocessing/OutputPass.js');
  run({ THREE, GLTFLoader, DRACOLoader, dracoPath, extra: { makeRender: (scene, camera, w, h) => {
    const renderer = new THREE.WebGLRenderer({ antialias: false, alpha: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5)); renderer.setSize(w, h);
    document.body.appendChild(renderer.domElement);
    const composer = new EffectComposer(renderer, new THREE.WebGLRenderTarget(w, h));
    composer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
    composer.addPass(new RenderPass(scene, camera)); composer.addPass(new OutputPass());
    return () => composer.render();

  const THREE = await import('three/webgpu');
  const { pass } = await import('three/tsl');
  const usePipeline = q.get('post') !== '0';
  const { LegacyMeshPhysicalNodeMaterial } = await import('./__legacy-material.js');
  run({ THREE, GLTFLoader, DRACOLoader, dracoPath, extra: { Material: q.get('mat') === 'classic' ? THREE.MeshPhysicalMaterial : q.get('mat') === 'legacy' ? class extends LegacyMeshPhysicalNodeMaterial { constructor(p) { super({ ...p, ...(q.get('sheen') ? { sheen: +q.get('sheen') } : {}) }); } } : THREE.MeshPhysicalNodeMaterial, makeRender: async (scene, camera, w, h) => {
    const renderer = new THREE.WebGPURenderer({ antialias: false, alpha: true, forceWebGL: mode === 'webgpu-gl' });
    renderer.setClearColor(0x000000, 0);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5)); renderer.setSize(w, h);
    document.body.appendChild(renderer.domElement);
    await renderer.init();
    const meshes = []; scene.traverse((o) => o.isMesh && meshes.push(o));
    if (q.get('sheen') === '0') meshes[0].material.sheen = 0;
    if (q.get('legacy') === '1') { const { applyLegacySheen } = await import('./__legacy-sheen.js'); applyLegacySheen(meshes[0].material, scene.environment); }
    window.__renderer = renderer; window.__THREE = THREE;
    if (!usePipeline) return () => renderer.render(scene, camera);
    const pipeline = new THREE.RenderPipeline(renderer, pass(scene, camera));
    return () => pipeline.render();
  } } });
}
</script></body></html>
