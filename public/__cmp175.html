<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;height:100%;background:#1a1a1a;overflow:hidden}canvas{display:block}#l{position:fixed;top:4px;left:6px;color:#fff;font:12px monospace;z-index:2}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.175.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.175.0/examples/jsm/"}}</script></head>
<body><div id="l">r175 WebGL + composer (original)</div><script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { run } from './__cmp-scene.js';
run({ THREE, GLTFLoader, DRACOLoader, dracoPath: 'https://cdn.jsdelivr.net/npm/three@0.175.0/examples/jsm/libs/draco/', extra: {
  makeRender: (scene, camera, w, h) => {
    const renderer = new THREE.WebGLRenderer({ antialias: false, alpha: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5)); renderer.setSize(w, h);
    document.body.appendChild(renderer.domElement);
    const composer = new EffectComposer(renderer, new THREE.WebGLRenderTarget(w, h));
    composer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
    composer.addPass(new RenderPass(scene, camera)); composer.addPass(new OutputPass());
    window.__renderer = renderer;
    return () => composer.render();
  } } });
</script></body></html>
