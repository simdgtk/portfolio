<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;height:100%;background:#1a1a1a;overflow:hidden}canvas{display:block}#l{position:fixed;top:4px;left:6px;color:#fff;font:12px monospace;z-index:2}</style>
<script>
const q = new URLSearchParams(location.search); const v = q.get('v') ?? '0.175.0';
const s = document.createElement('script'); s.type = 'importmap';
s.textContent = JSON.stringify({ imports: { three: `https://cdn.jsdelivr.net/npm/three@${v}/build/three.module.js`, 'three/addons/': `https://cdn.jsdelivr.net/npm/three@${v}/examples/jsm/` } });
document.currentScript.after(s);
</script></head>
<body><div id="l"></div><script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { run } from './__cmp-scene.js';
const q = new URLSearchParams(location.search); const v = q.get('v') ?? '0.175.0';
const over = {}; for (const k of ['sheen','iridescence','roughness','metalness']) if (q.has(k)) over[k] = +q.get(k);
document.getElementById('l').textContent = `r${THREE.REVISION} WebGL ${JSON.stringify(over)}`;
class Mat extends THREE.MeshPhysicalMaterial { constructor(p) { super({ ...p, ...over }); } }
run({ THREE, GLTFLoader, DRACOLoader, dracoPath: `https://cdn.jsdelivr.net/npm/three@${v}/examples/jsm/libs/draco/`, extra: { Material: Mat,
  makeRender: (scene, camera, w, h) => {
    const renderer = new THREE.WebGLRenderer({ antialias: false, alpha: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5)); renderer.setSize(w, h);
    document.body.appendChild(renderer.domElement);
    const composer = new EffectComposer(renderer, new THREE.WebGLRenderTarget(w, h));
    composer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
    composer.addPass(new RenderPass(scene, camera)); composer.addPass(new OutputPass());
    return () => composer.render();
  } } });
</script></body></html>
