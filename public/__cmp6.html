<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:#000;display:grid;grid-template-columns:1fr 1fr;gap:2px;height:100vh}iframe{border:0;width:100%;height:100%}</style></head><body>

<iframe src="/__cmp186.html?r=webgpu&legacy=1"></iframe>
<script>
async function pixels(url) { const img = new Image(); img.src = url; await img.decode(); const c = document.createElement('canvas'); c.width = img.width; c.height = img.height; const x = c.getContext('2d'); x.drawImage(img, 0, 0); return x.getImageData(0, 0, c.width, c.height).data; }
window.compare = async () => {
  const frames = [...document.querySelectorAll('iframe')];
  const shots = await Promise.all(frames.map((f) => pixels(f.contentWindow.__shot)));
  const ref = shots[0];
  return frames.map((f, i) => {
    const d = shots[i]; let n = 0, diff = 0, mean = [0, 0, 0], big = 0;
    for (let p = 0; p < ref.length; p += 4) {
      if (ref[p + 3] < 8 && d[p + 3] < 8) continue; n++;
      let e = 0; for (let k = 0; k < 3; k++) { e += Math.abs(ref[p + k] - d[p + k]); mean[k] += d[p + k]; }
      diff += e / 3; if (e / 3 > 24) big++;
    }
    return { src: f.getAttribute('src'), pixels: n, meanAbsDiff: +(diff / n).toFixed(2), pctOver24: +(100 * big / n).toFixed(1), meanRGB: mean.map((m) => Math.round(m / n)) };
  });
};
</script></body></html>
